<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>dsh ui-theme host</title>
<style>
  body { margin: 0; font-family: -apple-system, sans-serif; background: var(--dsw-alias-bg-base, #fff); color: var(--dsw-alias-label-primary, #111); }
  #page { max-width: 760px; margin: 24px auto; padding: 0 24px; }
  h1 { font-size: 18px; margin: 0 0 18px; }
  .plugin-row { border-top: 1px solid #ddd; padding: 12px 0; }
</style>
</head>
<body>
<script>
window.onerror = function(message) { document.title = 'ERR ' + message; var e=document.getElementById('error'); if(e)e.textContent=String(message); };
window.addEventListener('unhandledrejection', function(event) { document.title = 'REJ ' + String(event.reason); });
document.addEventListener('click', function(event) {
  var el = event.target;
  var log = document.getElementById('clicklog');
  if (log) log.textContent = 'click: ' + (el && (el.textContent || el.tagName));
});
</script>
<div id="page"><h1>dsh ui-theme — component host proof</h1><div id="root"></div><pre id="error" style="color:#b00;white-space:pre-wrap"></pre><pre id="clicklog" style="color:#888;font-size:12px"></pre></div>
<script src="host.js"></script>
<script src="theme-client.js"></script>
<script>window.__dshRun()</script>
<script>
if (true) {
  setTimeout(function () {
    var buttons = Array.prototype.slice.call(document.querySelectorAll('button'));
    var dark = buttons.find(function (button) { return button.textContent.includes('Dark'); });
    if (dark) dark.click();
  }, 1500);
}
</script>
</body>
</html>
