<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Preview</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
      color: #1c1c1c;
      background: #fff;
    }
    #bar {
      display: flex;
      align-items: center;
      gap: 8px;
      box-sizing: border-box;
      height: 40px;
      padding: 0 16px;
      border-bottom: 1px solid #e4e4e4;
      flex: none;
    }
    #tabs {
      display: flex;
      flex: 1 1 0%;
      align-items: center;
      gap: 4px;
      min-width: 0;
      overflow: hidden;
    }
    .tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-sizing: border-box;
      max-width: 240px;
      min-width: 0;
      height: 32px;
      padding: 0 8px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: inherit;
      font: inherit;
      line-height: 32px;
      cursor: pointer;
      flex: 1 1 0%;
      overflow: hidden;
      appearance: none;
      -webkit-appearance: none;
    }
    .tab-name {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: left;
    }
    .tab-close {
      flex: none;
      width: 14px;
      color: #777;
      font-size: 14px;
      line-height: 14px;
      text-align: center;
    }
    .tab:hover { background: rgba(0, 0, 0, 0.04); }
    .tab.active { background: #f2f2f2; }
    #wrap {
      flex: none;
      box-sizing: border-box;
      height: 32px;
      padding: 0 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: inherit;
      font: inherit;
      line-height: 32px;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }
    #wrap:hover { background: rgba(0, 0, 0, 0.04); }
    #wrap.on { background: #f2f2f2; }
    body.dark { background: #282c34; color: #d7dae0; }
    body.dark #bar { border-bottom-color: #3e4451; }
    body.dark .tab-close { color: #9aa0a6; }
    body.dark .tab:hover,
    body.dark #wrap:hover { background: rgba(255, 255, 255, 0.06); }
    body.dark .tab.active,
    body.dark #wrap.on { background: rgba(255, 255, 255, 0.1); }
    #notice {
      display: none;
      padding: 4px 8px;
      background: #fff6d8;
    }
    #editor { flex: 1; min-height: 0; }
  </style>
</head>
<body>
  <div id="bar">
    <div id="tabs"></div>
    <button id="wrap" type="button" aria-pressed="false" title="Toggle line wrap">Wrap</button>
  </div>
  <div id="notice"></div>
  <div id="editor"></div>
  <script src="bundle.js"></script>
</body>
</html>
