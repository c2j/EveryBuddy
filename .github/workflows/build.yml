name: build

# Tag-only: pushing a v* tag builds every target and publishes a release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # packaging/linux/package.sh builds inside Debian 10 (glibc 2.28), on
          # the runner's own architecture, so the resulting bundle runs on any
          # system with glibc >= 2.28.
          - arch: x86_64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4

      - name: Check that the scripts parse
        run: |
          bash -n packaging/linux/*.sh packaging/macos/*.sh .github/scripts/*.sh
          # install.sh, run.sh and the macOS launcher run under /bin/sh (dash on
          # Debian, bash-in-sh-mode on macOS), where bash-only syntax would fail
          # at run time rather than here.
          docker run --rm -v "$PWD":/src:ro debian:10 \
            dash -n /src/packaging/linux/install.sh /src/packaging/linux/run.sh /src/packaging/macos/launcher.sh.in

      - name: Build the bundle (Debian 10, glibc 2.28)
        env:
          PLATFORM: ${{ matrix.platform }}
        run: packaging/linux/package.sh

      # The requirement is a tree that runs with nothing installed, so the test
      # is a second container that has none of it — no GTK, no Pango, no Cairo,
      # no fontconfig, no fonts — running the app's own selftest, which prints
      # the geometry it is supposed to have.
      - name: Run it on a bare Debian 10
        env:
          PLATFORM: ${{ matrix.platform }}
        run: packaging/linux/verify.sh

      - uses: actions/upload-artifact@v4
        with:
          name: evobuddy-linux-${{ matrix.arch }}
          # The ones that name a file: everything is evobuddy-<version>-linux-*.
          path: dist/evobuddy-*-linux-*
          if-no-files-found: error

  windows:
    name: windows-x86_64
    runs-on: windows-2022
    # Soft failure on purpose: this job builds and bundles the app the same way
    # the notebook demo was built, but nothing in this workflow can test the
    # result, and it is not self-contained the way the Linux bundle is (see
    # .github/scripts/build-windows.sh). Windows 7/8.1 — a stated requirement —
    # is unresolved (spec §10-23, §10-24). Do not let it block the release.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - uses: msys2/setup-msys2@v2
        with:
          # UCRT64 is the current MSYS2 environment (MINGW64 is deprecated, and
          # UCRT64 targets Windows 10+).
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-pkg-config
            zip

      - name: Build (MinGW-w64) and bundle GTK 3 DLLs
        shell: msys2 {0}
        run: bash ./.github/scripts/build-windows.sh

      - uses: actions/upload-artifact@v4
        with:
          name: evobuddy-windows-x86_64
          path: evobuddy-*-windows-*
          if-no-files-found: error

  macos:
    name: macos-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # bundle.sh packs whatever Homebrew provides on each runner, so the
          # .app's minimum macOS tracks the brew tier of that image. Apple's
          # last Intel image is macos-15-intel (macos-13 closed in 2025-12).
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install GTK 3 and the icon toolchain
        run: brew install gtk+3 pkg-config librsvg

      - name: Build EvoBuddy.app
        run: packaging/macos/bundle.sh

      # Same script a developer runs: audit every load command, hide the
      # Homebrew prefix, and run the app's geometry selftest without it.
      - name: Verify it without Homebrew
        run: packaging/macos/verify.sh

      - uses: actions/upload-artifact@v4
        with:
          name: evobuddy-macos-${{ matrix.arch }}
          path: dist/evobuddy-*-macos-*
          if-no-files-found: error

  release:
    name: release
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
