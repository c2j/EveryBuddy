# EvoBuddy builds as a Cargo workspace: the GTK host (`crates/eb`), the plugin
# surface (`crates/eb-api`), and the built-in plugins (`crates/plugins/*`). The
# plugin crates must never depend on the host — Cargo enforces the boundary that
# "everything is a plugin" is about.
#
# The plugin runtime is rutis, vendored at `vendor/rutis` (see that crate's
# README for the one deliberate delta from upstream: a narrowed tokio feature
# list). The measurement workspace that picked it lives in `prototype/`.

[workspace]
resolver = "2"
members = [
    "crates/eb",
    "crates/eb-api",
    "crates/plugins/eb-plugin-nav",
    "crates/plugins/eb-plugin-notices",
    "crates/plugins/eb-plugin-composer",
    "crates/plugins/eb-plugin-demo-agent",
    "crates/plugins/eb-plugin-acp-agent",
]
# The vendored plugin runtime is a path dependency, not a member: building its
# own test target would drag in its dev-dependencies (tokio's multi-thread
# runtime), which the vendored fork deliberately narrows away. `prototype/` is
# the measurement workspace and carries its own Cargo tree.
exclude = ["vendor", "prototype"]

[workspace.package]
version = "0.7.26"
edition = "2021"
license = "MIT"

# Shared tool-library versions. The Custom Model agent's search tools are
# built on the ripgrep library family (crates/eb/src/tools/search.rs); pinning
# them here keeps every future consumer on one tested combination.
[workspace.dependencies]
ignore = "0.4"
globset = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"

[profile.release]
lto = true
